name: sync

# Keeps the archive current on its own, all year round.
#
# Every night at 01:30 UTC — half an hour after the flying day turns over at
# 04:00 in Kampala — this harvests the fleet's flying from the Flightradar24 API:
# each airframe's flights since the last run, a playback for every one the
# archive does not already hold, the track filed into its month, the month
# rebuilt. It commits only when something changed, and it fails loudly rather
# than quietly if the API is answering with nothing usable.
#
# Needs repository secrets FR24_SUBSCRIPTION_KEY and FR24_TOKEN (the licensed
# API), or FR24_USERNAME and FR24_PASSWORD. Without them the job stops before
# writing anything.
#
# To run it by hand: Actions → sync → Run workflow, and click the green button.
# Leave every field alone — the defaults are the nightly run. The only two boxes
# worth ticking are dry_run (look, fetch nothing) and mail_test (send one test
# email and stop). A backfill from a date is the single text field.
#
# Nothing is lost to a missed night: a run looks three days back, so whatever a
# dropped schedule skipped is picked up by the next one.
#
# It reports every run two ways. Each night's summary is posted as a comment on an
# issue — the existing FR24-status thread, or a new one — so there is always a
# record in the repository; and if SYNC_MAIL_USER / SYNC_MAIL_PASS are set that
# same summary is emailed. SYNC_LOG=off silences the issue, and SYNC_MAIL_MODE
# (`always` or `work`) decides what counts as worth reporting.

on:
  schedule:
    - cron: "30 1 * * *"        # nightly, 04:30 Kampala
  workflow_dispatch:
    inputs:
      since:
        description: "Backfill from a date (YYYY-MM-DD). Leave empty for a normal run."
        required: false
        type: string
      dry_run:
        description: "Tick to look without fetching. Leave unticked for a real run."
        required: false
        type: boolean
        default: false
      mail_test:
        description: "Tick to send one test email and nothing else."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fr24-sync
  cancel-in-progress: false

env:
  fr24_subscription_key: ${{ secrets.FR24_SUBSCRIPTION_KEY }}
  fr24_token: ${{ secrets.FR24_TOKEN }}
  fr24_username: ${{ secrets.FR24_USERNAME }}
  fr24_password: ${{ secrets.FR24_PASSWORD }}
  DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
  SINCE: ${{ inputs.since }}
  DAYS: "3"
  GAPS: "1"

jobs:
  sync:
    if: github.event_name != 'workflow_dispatch' || inputs.mail_test != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # always the default branch (`main`): the job runs the code that is live
          # and commits straight back to it. A dispatch from a feature branch
          # therefore runs main's code, never the branch's.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the Flightradar24 client
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Harvest the fleet's flying
        run: |
          args=(--days "$DAYS")
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE" --ignore-state); fi
          if [ -n "$DRY_RUN" ]; then args+=(--dry-run); fi
          python3 work/sync_fr24.py "${args[@]}"

      - name: Close the sectors still missing
        # Every month from June, not just this one: a hole in a rotation that
        # landed in July stays a hole until something goes back for it. A budget
        # keeps the job finite and the API polite; state/sweep.json remembers
        # what has been tried, so a sector Flightradar24 will not serve is parked
        # rather than asked for every night forever.
        if: ${{ env.DRY_RUN == '' && env.GAPS == '1' }}
        continue-on-error: true
        env:
          SWEEP_BUDGET: ${{ vars.SWEEP_BUDGET || '100' }}
          # how far back the subscription's record reaches: Basic 7 days,
          # Silver 90, Gold 365, Business 1095. Raise the variable if you upgrade
          # and the sweep will start reaching further into the archive.
          FR24_HISTORY_DAYS: ${{ vars.FR24_HISTORY_DAYS || '7' }}
        run: python3 work/sweep_gaps.py --budget "$SWEEP_BUDGET" --delay 1 --pause 1

      - name: Run the tests
        run: python3 -m unittest discover -s tests

      - name: Commit straight to the default branch
        if: ${{ env.DRY_RUN == '' }}
        run: |
          branch="${{ github.event.repository.default_branch }}"
          git config user.name "fr24-sync"
          git config user.email "actions@users.noreply.github.com"
          git add archive state
          if git diff --cached --quiet; then
            echo "no new flying — nothing to commit"
            exit 0
          fi
          months=$(git diff --cached --name-only | cut -d/ -f1-2 | grep '^archive/' | sort -u | tr '\n' ' ')
          git commit -m "sync: ${months:-archive}" \
                     -m "Harvested from the Flightradar24 API by .github/workflows/sync.yml."
          # straight to the branch, no pull request. If a manual push landed while
          # this ran, rebase onto it and try again rather than lose the night.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              echo "pushed to ${branch}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto ${branch}"
            git pull --rebase --autostash origin "${branch}"
          done
          echo "could not push to ${branch}: check that branch protection lets the" \
               "GitHub Actions bot write, or give the job a token that may" >&2
          exit 1

      - name: Email the result
        # a dry run reports itself in the log rather than the mailbox
        if: always() && inputs.dry_run != true
        # a red step here means the mail did not leave — but never a failed night
        continue-on-error: true
        env:
          MAIL_TO: ${{ secrets.SYNC_MAIL_TO }}
          MAIL_USER: ${{ secrets.SYNC_MAIL_USER }}
          MAIL_PASS: ${{ secrets.SYNC_MAIL_PASS }}
          MAIL_MODE: ${{ vars.SYNC_MAIL_MODE || 'always' }}
        run: |
          python3 work/notify.py \
            --status "${{ job.status }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --require-config

      - name: Log the night on a tracking issue
        # GitHub sends the notification itself, so this route needs no mailbox and
        # no app password. On by default when no mail credentials are configured;
        # set the repository variable SYNC_LOG to `off` to silence it.
        if: always() && inputs.dry_run != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MAIL_USER: ${{ secrets.SYNC_MAIL_USER }}
          MAIL_MODE: ${{ vars.SYNC_MAIL_MODE || 'always' }}
          SYNC_LOG: ${{ vars.SYNC_LOG || '' }}
        run: |
          if [ "$SYNC_LOG" = "off" ]; then exit 0; fi
          body=$(python3 work/notify.py --status "${{ job.status }}" --format issue \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --repo "${{ github.repository }}")
          if [ -z "$body" ]; then
            echo "nothing worth reporting this run (mail mode: $MAIL_MODE)"
            exit 0
          fi
          gh label create sync-log --color BFD4F2 \
            --description "one comment per nightly harvest" 2>/dev/null || true
          number=$(gh issue list --label sync-log --state open --limit 1 --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            # the older workflow kept its reports on an issue called FR24-status;
            # continue that thread rather than start a second one
            number=$(gh issue list --state open --limit 50 --json number,title \
              --jq '[.[] | select(.title == "FR24-status")][0].number // ""')
          fi
          if [ -z "$number" ]; then
            gh issue create --title "Nightly sync log" --label sync-log \
              --body "Every night's harvest is reported here as a comment, so it can be watched, muted or filtered like any other GitHub notification." >/dev/null
            number=$(gh issue list --label sync-log --state open --limit 1 --json number --jq '.[0].number')
          fi
          gh issue comment "$number" --body "$body"

      - name: Say so when it breaks
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Nightly sync is failing";
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "sync"
            });
            const body = [
              `The nightly harvest failed on run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              "",
              "Until it is fixed the archive is not growing. The usual causes are",
              "an expired Flightradar24 token, a rate limit, or a run of playbacks",
              "the API would not serve.",
            ].join("\n");
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["sync"]
              });
            }

  mail:
    # Actions → sync → Run workflow → tick "mail_test" to prove the mailbox in
    # ten seconds, without waiting for 01:30 or touching the archive.
    if: github.event_name == 'workflow_dispatch' && inputs.mail_test == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send a test email
        env:
          MAIL_TO: ${{ secrets.SYNC_MAIL_TO }}
          MAIL_USER: ${{ secrets.SYNC_MAIL_USER }}
          MAIL_PASS: ${{ secrets.SYNC_MAIL_PASS }}
        run: python3 work/notify.py --test --require-config
