name: 00-install-the-build

# One-shot. Upload `ci_install.tar.gz` to this repository (Add file → Upload files, at the root,
# nothing inside a folder), put this file at `.github/workflows/00-install.yml`, then Actions →
# "00-install-the-build" → Run workflow. It unpacks the bundle, commits `tools/`, `work/`,
# `reference/`, `metar/`, `.gitignore` and the nightly workflow, then deletes the tarball.
#
# Why a workflow can do this: the runner is already authenticated to the repository, so no token
# has to be pasted anywhere. One setting is needed first — see CI_INSTALL.txt, step 0:
# Settings → Actions → General → Workflow permissions → **Read and write permissions**.
#
# After it goes green: delete this file (Add file → it opens in the editor → trash icon, or let the
# nightly run leave it; it only ever runs when a person presses the button), and run
# "fr24-nightly" once with `skip_fetch` ticked.

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: 'path of the bundle you uploaded'
        required: false
        default: 'ci_install.tar.gz'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: unpack
        run: |
          set -euo pipefail
          bundle="${{ inputs.bundle }}"
          test -f "$bundle" || { echo "::error::$bundle is not in the repository root - upload it with Add file → Upload files"; exit 1; }
          tar xzf "$bundle" -C "$GITHUB_WORKSPACE"
          echo; echo "what the bundle brought:"
          ls -1 tools .github/workflows work | head -20
          python3 -c "import ast,sys; [ast.parse(open(p).read()) for p in ('tools/ci_run.py','tools/fetch_fr24.py','fr24_update.py')]; print('the build scripts parse as valid python')"

      - name: commit
        run: |
          set -euo pipefail
          git config user.name  'fr24-ci'
          git config user.email 'fr24-ci@users.noreply.github.com'
          rm -f "${{ inputs.bundle }}"
          git add -A -- tools .github .gitignore CI_INSTALL.txt fr24_update.py build_log.py clean_zip.py \
                        work reference metar fleet_meta.csv
          git rm -q --cached --ignore-unmatch "${{ inputs.bundle }}" 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to install"; exit 0; fi
          git commit -q -m "Add the FR24 build: tools/, work/*.py, fr24-nightly workflow"
          git push
          echo "installed at $(git rev-parse --short HEAD)"

      - name: say what happened
        run: |
          {
            echo '### install done'
            echo
            echo 'Nightly build: **Actions → fr24-nightly → Run workflow → tick `skip_fetch`**.'
            echo
            echo 'Files now on the default branch:'
            echo '```'
            git show --stat --oneline HEAD | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
