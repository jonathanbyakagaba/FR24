name: fetch missing sectors

# Fills the holes in the archive from the Flightradar24 API: the tag sectors
# behind the Lusaka/Harare and Zanzibar/Kilimanjaro runs, and any numbered
# service the movement enumeration skipped. Run it for one month at a time; it
# writes the new tracks into archive/<month>/tracks/, rebuilds the month so the
# rotations close, and commits the result.
#
# Needs repository secrets FR24_USERNAME / FR24_PASSWORD, or
# FR24_SUBSCRIPTION_KEY / FR24_TOKEN. Without them the job stops and changes
# nothing.
#
# `workflow_dispatch` only offers a workflow that is on the default branch, so
# this file has to reach `main` before the button appears.

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month to repair, YYYY-MM"
        required: true
        type: string
      dry_run:
        description: "List what would be fetched, fetch nothing"
        required: false
        type: boolean
        default: false
      limit:
        description: "Fetch at most this many sectors (0 = all)"
        required: false
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: fetch-fr24-${{ inputs.month }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      MONTH: ${{ inputs.month }}
      LIMIT: ${{ inputs.limit }}
      DRY_RUN: ${{ inputs.dry_run }}
      fr24_username: ${{ secrets.FR24_USERNAME }}
      fr24_password: ${{ secrets.FR24_PASSWORD }}
      fr24_subscription_key: ${{ secrets.FR24_SUBSCRIPTION_KEY }}
      fr24_token: ${{ secrets.FR24_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Flightradar24 client
        run: python3 -m pip install --quiet "fr24[curl]"

      - name: List the sectors the record is missing
        run: python3 work/fetch_fr24_tracks.py --month "$MONTH" --gaps-only

      - name: Fetch them
        run: |
          args=(--month "$MONTH" --limit "$LIMIT")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 work/fetch_fr24_tracks.py "${args[@]}"

      - name: Rebuild the month so the rotations close
        if: ${{ inputs.dry_run == false }}
        run: python3 work/fr24_tracks.py --month "$MONTH"

      - name: Run the tests
        run: python3 -m unittest discover -s tests

      - name: Commit the fetched sectors and the rebuilt month
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "fr24-fetch"
          git config user.email "actions@users.noreply.github.com"
          git add "archive/$MONTH" requirements.txt
          if git diff --cached --quiet; then
            echo "nothing fetched — the month is unchanged"
            exit 0
          fi
          git commit -m "fetch $MONTH's missing sectors from the Flightradar24 API"
          git push
